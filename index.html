<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Building Diagnostics Workspace</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{font-family:Inter,Arial,sans-serif;background:#f1f5f9;color:#1e293b}.navy{background:#0f2040}.card{background:#fff;border-radius:16px;box-shadow:0 1px 3px #0f20401a}.field{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:9px 11px;font-size:14px}.field:focus{outline:2px solid #d1e5f9;border-color:#4797e7}.btn{border-radius:10px;padding:9px 13px;font-size:13px;font-weight:700}.blue{background:#1e6fbd;color:#fff}.muted{color:#64748b}.status{border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;background:#e2e8f0}.status.in{background:#fef3c7;color:#b45309}.status.done{background:#dcfce7;color:#15803d}</style></head><body><header class="fixed top-0 left-0 right-0 z-20 navy text-white h-[60px]"><div class="h-full flex items-center gap-3 px-4"><i data-lucide="clipboard-check" class="w-5 h-5 text-blue-300"></i><b>Building Diagnostics Workspace</b><div class="ml-auto flex gap-2"><button id="new" class="btn blue">＋ New Project</button><button id="import" class="btn bg-[#1a3460]">Import</button><button id="export" class="btn bg-[#1a3460]">Export</button><button id="auth" class="btn bg-[#1a3460]">Sign in</button></div></div></header><main class="pt-[84px] max-w-[1500px] mx-auto p-4 md:p-6"><section class="mb-5"><h1 class="text-2xl font-bold text-[#0f2040]">Project Dashboard</h1><p class="muted text-sm mt-1">Create, search, and reopen audit projects across envelope and equipment assessments.</p></section><section class="card p-5 mb-5"><div class="grid grid-cols-1 md:grid-cols-4 gap-3"><input id="search" class="field md:col-span-2" placeholder="Search client, project ID, facility, auditor, address, notes..."><select id="clientFilter" class="field"><option value="">All clients</option></select><select id="auditorFilter" class="field"><option value="">All auditors</option></select><select id="statusFilter" class="field"><option value="">All statuses</option><option>Not started</option><option>In progress</option><option>Complete</option><option>Archived</option></select></div></section><section class="card overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-100 text-xs font-semibold"><tr><th class="p-3 text-left">Project ID</th><th class="p-3 text-left">Client</th><th class="p-3 text-left">Facility</th><th class="p-3 text-left">Auditor</th><th class="p-3 text-left">Audit date</th><th class="p-3">Envelope</th><th class="p-3">Equipment</th><th class="p-3">Status</th><th class="p-3 text-left">Updated</th><th class="p-3">Actions</th></tr></thead><tbody id="projects"></tbody></table><div id="empty" class="p-10 text-center muted hidden">No projects match the current search.</div></section></main><dialog id="projectDialog" class="rounded-2xl p-0 shadow-2xl w-[min(720px,calc(100% - 24px))]"><form method="dialog" id="projectForm" class="p-6"><h2 class="text-xl font-bold text-[#0f2040] mb-4">Project information</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-3"><label class="text-xs font-semibold">Site / Project ID<input name="project_id" class="field mt-1" required></label><label class="text-xs font-semibold">Client / Organization<input name="client" class="field mt-1"></label><label class="text-xs font-semibold">Facility name<input name="facility" class="field mt-1"></label><label class="text-xs font-semibold">Auditor<input name="auditor" class="field mt-1"></label><label class="text-xs font-semibold">Audit date<input name="audit_date" type="date" class="field mt-1"></label><label class="text-xs font-semibold">Facility type<input name="facility_type" class="field mt-1"></label><label class="text-xs font-semibold md:col-span-2">Address<input name="address" class="field mt-1"></label><label class="text-xs font-semibold">City<input name="city" class="field mt-1"></label><label class="text-xs font-semibold">Province / State<input name="province" class="field mt-1"></label><label class="text-xs font-semibold">Floor area<input name="floor_area" type="number" class="field mt-1"></label><label class="text-xs font-semibold">Area unit<select name="area_unit" class="field mt-1"><option>m²</option><option>ft²</option></select></label><label class="text-xs font-semibold md:col-span-2">Notes<textarea name="notes" class="field mt-1" rows="3"></textarea></label></div><div class="flex justify-end gap-2 mt-5"><button value="cancel" class="btn bg-slate-200">Cancel</button><button value="save" class="btn blue">Save project</button></div></form></dialog><input id="file" type="file" accept="application/json" hidden><script>const localKey='audit-dashboard-v3';let projects=JSON.parse(localStorage.getItem(localKey)||'[]'),editing=null;let online=false,client=null;if(window.supabase&&window.AUDIT_SUPABASE_URL&&!window.AUDIT_SUPABASE_URL.includes('YOUR-')){client=supabase.createClient(window.AUDIT_SUPABASE_URL,window.AUDIT_SUPABASE_PUBLISHABLE_KEY);online=true}const $=id=>document.getElementById(id);function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function key(p){return [p.project_id,p.client,p.facility,p.auditor,p.address,p.city,p.province,p.facility_type,p.notes].join(' ').toLowerCase()}function saveLocal(){localStorage.setItem(localKey,JSON.stringify(projects))}async function load(){if(online){const{data,error}=await client.from('audit_projects').select('*').order('updated_at',{ascending:false});if(!error&&data){projects=data;return}}render()}async function persist(p){p.updated_at=new Date().toISOString();if(online){const{data,error}=await client.from('audit_projects').upsert(p,{onConflict:'id'}).select().single();if(!error){let i=projects.findIndex(x=>x.id===p.id);if(i<0)projects.unshift(data);else projects[i]=data;render();return}}let i=projects.findIndex(x=>x.id===p.id);if(i<0)projects.unshift(p);else projects[i]=p;saveLocal();render()}function render(){let q=$('search').value.toLowerCase(),cf=$('clientFilter').value,af=$('auditorFilter').value,sf=$('statusFilter').value;let clients=[...new Set(projects.map(p=>p.client).filter(Boolean))].sort(),auditors=[...new Set(projects.map(p=>p.auditor).filter(Boolean))].sort();$('clientFilter').innerHTML='<option value="">All clients</option>'+clients.map(x=>`<option ${x===cf?'selected':''}>${esc(x)}</option>`).join('');$('auditorFilter').innerHTML='<option value="">All auditors</option>'+auditors.map(x=>`<option ${x===af?'selected':''}>${esc(x)}</option>`).join('');let list=projects.filter(p=>(!q||key(p).includes(q))&&(!cf||p.client===cf)&&(!af||p.auditor===af)&&(!sf||p.status===sf));$('empty').classList.toggle('hidden',list.length>0);$('projects').innerHTML=list.map(p=>`<tr class="border-t border-slate-200"><td class="p-3 font-semibold">${esc(p.project_id)}</td><td class="p-3">${esc(p.client)}</td><td class="p-3">${esc(p.facility)}</td><td class="p-3">${esc(p.auditor)}</td><td class="p-3">${esc(p.audit_date||'')}</td><td class="p-3 text-center"><span class="status ${p.envelope_status==='Complete'?'done':'in'}">${esc(p.envelope_status||'Not started')}</span></td><td class="p-3 text-center"><span class="status ${p.equipment_status==='Complete'?'done':'in'}">${esc(p.equipment_status||'Not started')}</span></td><td class="p-3 text-center"><span class="status ${p.status==='Complete'?'done':p.status==='In progress'?'in':''}">${esc(p.status||'Not started')}</span></td><td class="p-3">${p.updated_at?new Date(p.updated_at).toLocaleDateString():''}</td><td class="p-3 whitespace-nowrap"><button class="text-[#1e6fbd] font-bold mr-2" onclick="openAudit('${p.id}','envelope')">Envelope</button><button class="text-[#1e6fbd] font-bold" onclick="openAudit('${p.id}','equipment')">Equipment</button></td></tr>`).join('')}function openAudit(id,type){location.href=(type==='equipment'?'EquipmentAudit.html':'BuildingEnvelopeChecklist.html')+'?project='+encodeURIComponent(id)}$('new').onclick=()=>{editing=null;$('projectForm').reset();$('projectDialog').showModal()};$('projectForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),now=new Date().toISOString();let p=Object.fromEntries(f.entries());p.id=crypto.randomUUID();p.owner_id=null;p.status='Not started';p.envelope_status='Not started';p.equipment_status='Not started';p.envelope_data={};p.equipment_data={};p.created_at=now;p.updated_at=now;await persist(p);$('projectDialog').close()};['search','clientFilter','auditorFilter','statusFilter'].forEach(id=>$(id).oninput=render);$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(projects,null,2)],{type:'application/json'}));a.download='audit-projects.json';a.click()};$('import').onclick=()=>$('file').click();$('file').onchange=e=>{let r=new FileReader();r.onload=()=>{projects=JSON.parse(r.result);saveLocal();render()};r.readAsText(e.target.files[0])};$('auth').onclick=async()=>{if(!online)return alert('Configure Supabase first by adding supabase-config.js values.');let email=prompt('Email address');if(email){let{error}=await client.auth.signInWithOtp({email});alert(error?error.message:'Check your email for the sign-in link.')}};load();if(window.lucide)lucide.createIcons();</script></body></html>
