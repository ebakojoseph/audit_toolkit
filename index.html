<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Building Diagnostics Workspace</title>

  <!-- ==================== External libraries ==================== -->
  <script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- ==================== Application styles ==================== -->
  <style>
    body { font-family: Inter, Arial, sans-serif; background: #f1f5f9; color: #1e293b; }
    .navy { background: #0f2040; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 1px 3px #0f20401a; }
    .field { width: 100%; border: 1px solid #cbd5e1; border-radius: 10px; padding: 9px 11px; font-size: 14px; background: #fff; }
    .btn { border-radius: 10px; padding: 9px 13px; font-size: 13px; font-weight: 700; }
    .blue { background: #1e6fbd; color: #fff; }
    .muted { color: #64748b; }
    .status { border-radius: 999px; padding: 3px 8px; font-size: 11px; font-weight: 700; background: #e2e8f0; white-space: nowrap; }
    .status.in { background: #fef3c7; color: #b45309; }
    .status.done { background: #dcfce7; color: #15803d; }
    dialog::backdrop { background: rgb(15 32 64 / 45%); }
  </style>
</head>

<body>
  <!-- ==================== Header ==================== -->
  <header class="fixed top-0 left-0 right-0 z-20 navy text-white h-[60px]">
    <div class="h-full flex items-center gap-3 px-4">
      <i data-lucide="clipboard-check" class="w-5 h-5 text-blue-300"></i>
      <b>Building Diagnostics Workspace</b>

      <!-- Microsoft authentication controls -->
      <div class="flex items-center gap-2 ml-2">
        <button id="btn-ms-login" type="button" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold">
          Sign in with Microsoft
        </button>
        <button id="btn-ms-logout" type="button" class="hidden bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold">
          Sign out
        </button>
        <span id="ms-user-name" class="text-xs text-blue-100"></span>
      </div>

      <!-- Dashboard actions; hidden until authentication succeeds -->
      <div id="dashboard-actions" class="hidden ml-auto flex gap-2">
        <button id="new" type="button" class="btn blue">＋ New Project</button>
        <button id="import" type="button" class="btn bg-[#1a3460]">Import</button>
        <button id="export" type="button" class="btn bg-[#1a3460]">Export</button>
      </div>
    </div>
  </header>

  <!-- ==================== Dashboard ==================== -->
  <main id="dashboard-content" class="hidden pt-[84px] max-w-[1500px] mx-auto p-4 md:p-6">
    <section class="mb-5">
      <h1 class="text-2xl font-bold text-[#0f2040]">Project Dashboard</h1>
      <p class="muted text-sm mt-1">Create, search, and reopen audit projects across envelope and equipment assessments.</p>
    </section>

    <!-- Search and filters -->
    <section class="card p-5 mb-5">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <input id="search" class="field md:col-span-2" placeholder="Search client, project ID, facility, auditor, address, notes...">
        <select id="clientFilter" class="field"><option value="">All clients</option></select>
        <select id="auditorFilter" class="field"><option value="">All auditors</option></select>
        <select id="statusFilter" class="field">
          <option value="">All statuses</option>
          <option>Not started</option>
          <option>In progress</option>
          <option>Complete</option>
          <option>Archived</option>
        </select>
      </div>
    </section>

    <!-- Project table -->
    <section class="card overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-slate-100 text-xs font-semibold">
          <tr>
            <th class="p-3 text-left">Project ID</th>
            <th class="p-3 text-left">Client</th>
            <th class="p-3 text-left">Facility</th>
            <th class="p-3 text-left">Auditor</th>
            <th class="p-3 text-left">Audit date</th>
            <th class="p-3">Envelope</th>
            <th class="p-3">Equipment</th>
            <th class="p-3">Status</th>
            <th class="p-3 text-left">Updated</th>
            <th class="p-3">Actions</th>
          </tr>
        </thead>
        <tbody id="projects"></tbody>
      </table>
      <div id="empty" class="p-10 text-center muted hidden">No projects match the current search.</div>
    </section>
  </main>

  <!-- ==================== Project dialog ==================== -->
  <dialog id="projectDialog" class="rounded-2xl p-0 shadow-2xl w-[min(760px,calc(100% - 24px))]">
    <form method="dialog" id="projectForm" class="p-6">
      <h2 class="text-xl font-bold text-[#0f2040] mb-4">Project information</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <label class="text-xs font-semibold">Site / Project ID<input name="project_id" class="field mt-1" required></label>
        <label class="text-xs font-semibold">Client / Organization<input name="client" class="field mt-1"></label>
        <label class="text-xs font-semibold">Facility name<input name="facility" class="field mt-1"></label>
        <label class="text-xs font-semibold">Auditor<input name="auditor" class="field mt-1"></label>
        <label class="text-xs font-semibold">Audit date<input name="audit_date" type="date" class="field mt-1"></label>
        <label class="text-xs font-semibold">Building type<select name="facility_type" class="field mt-1"><option value="">— Select —</option><option>Residential Single-Family</option><option>Residential Multi-Unit</option><option>Commercial</option><option>Industrial</option><option>Institutional</option><option>Mixed-Use</option></select></label>
        <label class="text-xs font-semibold md:col-span-2">Street address<input name="address" class="field mt-1"></label>
        <label class="text-xs font-semibold">City<input name="city" class="field mt-1"></label>
        <label class="text-xs font-semibold">Province / State<input name="province" class="field mt-1"></label>
        <label class="text-xs font-semibold">Gross floor area<input name="floor_area" type="number" step="0.01" class="field mt-1"></label>
        <label class="text-xs font-semibold">Area unit<select name="area_unit" class="field mt-1"><option>m²</option><option>ft²</option></select></label>
        <label class="text-xs font-semibold md:col-span-2">Notes<textarea name="notes" class="field mt-1" rows="3"></textarea></label>
      </div>
      <div class="flex justify-end gap-2 mt-5">
        <button type="button" id="cancelProject" class="btn bg-slate-200">Cancel</button>
        <button type="submit" class="btn blue">Save project</button>
      </div>
    </form>
  </dialog>

  <input id="file" type="file" accept="application/json" hidden>

  <!-- ==================== Application logic ==================== -->
  <script>
    // ---------- Application state ----------
    const STORAGE_KEY = 'audit-dashboard-v3';
    const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    let projects = loadProjects();
    let editingProject = null;
    let msalInstance = null;
    let microsoftReady = false;

    const $ = id => document.getElementById(id);

    // ---------- Microsoft authentication ----------
    const msalConfig = {
      auth: {
        clientId: 'f21c7beb-f07a-4f63-a384-84272182483e',
        authority: 'https://login.microsoftonline.com/organizations',
        redirectUri: isLocal ? 'http://localhost:3000/' : 'https://ebakojoseph.github.io/audit_toolkit/'
      },
      cache: { cacheLocation: 'sessionStorage', storeAuthStateInCookie: false }
    };

    const loginRequest = { scopes: ['User.Read'] };

    async function initializeMicrosoftAuth() {
      if (!window.msal) {
        $('btn-ms-login').disabled = true;
        $('btn-ms-login').textContent = 'Microsoft unavailable';
        return;
      }

      try {
        msalInstance = new window.msal.PublicClientApplication(msalConfig);
        await msalInstance.initialize();
        const redirectResult = await msalInstance.handleRedirectPromise();
        const account = redirectResult?.account || msalInstance.getAllAccounts()[0] || null;

        if (account) {
          msalInstance.setActiveAccount(account);
          showAuthenticatedUI(account);
        } else {
          showLoggedOutUI();
        }
      } catch (error) {
        console.error('Microsoft authentication initialization failed:', error);
        showLoggedOutUI();
      }
    }

    async function signInWithMicrosoft() {
  if (!msalInstance) {
    alert('Microsoft authentication is unavailable. Refresh the page and try again.');
    return;
  }

  try {
    await msalInstance.loginRedirect(loginRequest);
  } catch (error) {
    console.error('Microsoft sign-in failed:', error);
    alert(`Microsoft sign-in failed: ${error.message}`);
  }
}

    async function signOutWithMicrosoft() {
      if (!msalInstance) return;
      const account = msalInstance.getActiveAccount() || msalInstance.getAllAccounts()[0];
      await msalInstance.logoutRedirect({
        account,
        postLogoutRedirectUri: isLocal ? 'http://localhost:3000/' : 'https://ebakojoseph.github.io/audit_toolkit/'
      });
    }

    function showAuthenticatedUI(account) {
      microsoftReady = true;
      $('ms-user-name').textContent = account.name || account.username || '';
      $('btn-ms-login').classList.add('hidden');
      $('btn-ms-logout').classList.remove('hidden');
      $('dashboard-actions').classList.remove('hidden');
      $('dashboard-content').classList.remove('hidden');
      renderProjects();
    }

    function showLoggedOutUI() {
      microsoftReady = false;
      $('ms-user-name').textContent = '';
      $('btn-ms-login').classList.remove('hidden');
      $('btn-ms-logout').classList.add('hidden');
      $('dashboard-actions').classList.add('hidden');
      $('dashboard-content').classList.add('hidden');
    }

    // ---------- Local project storage ----------
    function loadProjects() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
      catch (error) { console.error('Could not load projects:', error); return []; }
    }

    function saveProjects() { localStorage.setItem(STORAGE_KEY, JSON.stringify(projects)); }

    // ---------- Formatting and filtering ----------
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[character]));
    }

    function statusBadge(status) {
      status = status || 'Not started';
      const className = status === 'Complete' ? 'done' : status === 'In progress' ? 'in' : '';
      return `<span class="status ${className}">${escapeHtml(status)}</span>`;
    }

    function projectSearchText(project) {
      return [project.project_id, project.client, project.facility, project.auditor, project.address, project.city, project.province, project.facility_type, project.floor_area, project.area_unit, project.notes].filter(Boolean).join(' ').toLowerCase();
    }

    function updateFilterOptions() {
      const selectedClient = $('clientFilter').value;
      const selectedAuditor = $('auditorFilter').value;
      const clients = [...new Set(projects.map(project => project.client).filter(Boolean))].sort();
      const auditors = [...new Set(projects.map(project => project.auditor).filter(Boolean))].sort();
      $('clientFilter').innerHTML = '<option value="">All clients</option>' + clients.map(value => `<option ${value === selectedClient ? 'selected' : ''}>${escapeHtml(value)}</option>`).join('');
      $('auditorFilter').innerHTML = '<option value="">All auditors</option>' + auditors.map(value => `<option ${value === selectedAuditor ? 'selected' : ''}>${escapeHtml(value)}</option>`).join('');
    }

    function getFilteredProjects() {
      const query = $('search').value.trim().toLowerCase();
      const client = $('clientFilter').value;
      const auditor = $('auditorFilter').value;
      const status = $('statusFilter').value;
      return projects.filter(project => (!query || projectSearchText(project).includes(query)) && (!client || project.client === client) && (!auditor || project.auditor === auditor) && (!status || project.status === status));
    }

    // ---------- Project table ----------
    function renderProjects() {
      updateFilterOptions();
      const list = getFilteredProjects();
      $('empty').classList.toggle('hidden', list.length > 0);
      $('projects').innerHTML = list.map(project => `<tr class="border-t border-slate-200"><td class="p-3 font-semibold">${escapeHtml(project.project_id)}</td><td class="p-3">${escapeHtml(project.client)}</td><td class="p-3">${escapeHtml(project.facility)}</td><td class="p-3">${escapeHtml(project.auditor)}</td><td class="p-3">${escapeHtml(project.audit_date)}</td><td class="p-3 text-center">${statusBadge(project.envelope_status)}</td><td class="p-3 text-center">${statusBadge(project.equipment_status)}</td><td class="p-3 text-center">${statusBadge(project.status)}</td><td class="p-3">${project.updated_at ? new Date(project.updated_at).toLocaleDateString() : ''}</td><td class="p-3"><button type="button" class="text-[#1e6fbd] font-bold" onclick="editProject('${encodeURIComponent(project.id)}')">Edit</button></td></tr>`).join('');
    }

    // ---------- Project dialog ----------
    function clearProjectForm() { $('projectForm').reset(); $('projectForm').elements.area_unit.value = 'm²'; }

    function openNewProjectDialog() { editingProject = null; clearProjectForm(); $('projectDialog').showModal(); }

    function editProject(encodedId) {
      const project = projects.find(item => item.id === decodeURIComponent(encodedId));
      if (!project) return;
      editingProject = project;
      const form = $('projectForm').elements;
      for (const key of ['project_id', 'client', 'facility', 'auditor', 'audit_date', 'address', 'city', 'province', 'facility_type', 'floor_area', 'notes']) form[key].value = project[key] || '';
      form.area_unit.value = project.area_unit || 'm²';
      $('projectDialog').showModal();
    }

    function closeProjectDialog() { if ($('projectDialog').open) $('projectDialog').close(); }

    function saveProjectForm(event) {
      event.preventDefault();
      const values = Object.fromEntries(new FormData(event.target).entries());
      const now = new Date().toISOString();
      const project = editingProject ? { ...editingProject, ...values, updated_at: now } : { id: crypto.randomUUID(), ...values, status: 'Not started', envelope_status: 'Not started', equipment_status: 'Not started', created_at: now, updated_at: now };
      const index = projects.findIndex(item => item.id === project.id);
      if (index < 0) projects.unshift(project); else projects[index] = project;
      saveProjects();
      editingProject = null;
      closeProjectDialog();
      renderProjects();
    }

    // ---------- Import and export ----------
    function exportProjects() {
      const blob = new Blob([JSON.stringify(projects, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'audit-projects.json';
      link.click();
    }

    function importProjects() { $('file').click(); }

    function importProjectFile(event) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(reader.result);
          if (!Array.isArray(imported)) throw new Error('Invalid project file');
          projects = imported;
          saveProjects();
          renderProjects();
        } catch (error) { alert(error.message); }
      };
      reader.readAsText(event.target.files[0]);
    }

    // ---------- Event handlers and startup ----------
    function bindEvents() {
      $('btn-ms-login').addEventListener('click', signInWithMicrosoft);
      $('btn-ms-logout').addEventListener('click', signOutWithMicrosoft);
      $('new').addEventListener('click', openNewProjectDialog);
      $('cancelProject').addEventListener('click', closeProjectDialog);
      $('projectForm').addEventListener('submit', saveProjectForm);
      $('search').addEventListener('input', renderProjects);
      ['clientFilter', 'auditorFilter', 'statusFilter'].forEach(id => $(id).addEventListener('change', renderProjects));
      $('import').addEventListener('click', importProjects);
      $('export').addEventListener('click', exportProjects);
      $('file').addEventListener('change', importProjectFile);
    }

    async function init() {
  showLoggedOutUI();
  bindEvents();

  await initializeMicrosoftAuth();

  if (window.lucide?.createIcons) {
    window.lucide.createIcons();
  }
}

document.addEventListener('DOMContentLoaded', init);
    }

    init();
  </script>
</body>
</html>
