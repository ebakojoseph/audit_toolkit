<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Building Diagnostics Workspace</title>
<script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body{font-family:Inter,Arial,sans-serif;background:#f1f5f9;color:#1e293b}.navy{background:#0f2040}.card{background:#fff;border-radius:16px;box-shadow:0 1px 3px #0f20401a}.field{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:9px 11px;font-size:14px;background:#fff}.btn{border-radius:10px;padding:9px 13px;font-size:13px;font-weight:700}.blue{background:#1e6fbd;color:#fff}.muted{color:#64748b}.status{border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;background:#e2e8f0;white-space:nowrap}.status.in{background:#fef3c7;color:#b45309}.status.done{background:#dcfce7;color:#15803d}dialog::backdrop{background:rgb(15 32 64 / 45%)}
</style>
</head>
<body>
<header class="fixed top-0 left-0 right-0 z-20 navy text-white h-[60px]"><div class="h-full flex items-center gap-3 px-4"><i data-lucide="clipboard-check" class="w-5 h-5 text-blue-300"></i><b>Building Diagnostics Workspace</b><div class="flex items-center gap-2 ml-2"><button id="btn-ms-login" type="button" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold">Sign in with Microsoft</button><span id="ms-user-name" class="text-xs text-blue-100"></span></div><div class="ml-auto flex gap-2"><button id="new" type="button" class="btn blue">＋ New Project</button><button id="import" type="button" class="btn bg-[#1a3460]">Import</button><button id="export" type="button" class="btn bg-[#1a3460]">Export</button></div></div></header>
<main class="pt-[84px] max-w-[1500px] mx-auto p-4 md:p-6"><section class="mb-5"><h1 class="text-2xl font-bold text-[#0f2040]">Project Dashboard</h1><p class="muted text-sm mt-1">Create, search, and reopen audit projects across envelope and equipment assessments.</p></section><section class="card p-5 mb-5"><div class="grid grid-cols-1 md:grid-cols-4 gap-3"><input id="search" class="field md:col-span-2" placeholder="Search client, project ID, facility, auditor, address, notes..."><select id="clientFilter" class="field"><option value="">All clients</option></select><select id="auditorFilter" class="field"><option value="">All auditors</option></select><select id="statusFilter" class="field"><option value="">All statuses</option><option>Not started</option><option>In progress</option><option>Complete</option><option>Archived</option></select></div></section><section class="card overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-100 text-xs font-semibold"><tr><th class="p-3 text-left">Project ID</th><th class="p-3 text-left">Client</th><th class="p-3 text-left">Facility</th><th class="p-3 text-left">Auditor</th><th class="p-3 text-left">Audit date</th><th class="p-3">Envelope</th><th class="p-3">Equipment</th><th class="p-3">Status</th><th class="p-3 text-left">Updated</th><th class="p-3">Actions</th></tr></thead><tbody id="projects"></tbody></table><div id="empty" class="p-10 text-center muted hidden">No projects match the current search.</div></section></main>
<dialog id="projectDialog" class="rounded-2xl p-0 shadow-2xl w-[min(760px,calc(100% - 24px))]"><form method="dialog" id="projectForm" class="p-6"><h2 class="text-xl font-bold text-[#0f2040] mb-4">Project information</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-3"><label class="text-xs font-semibold">Site / Project ID<input name="project_id" class="field mt-1" required></label><label class="text-xs font-semibold">Client / Organization<input name="client" class="field mt-1"></label><label class="text-xs font-semibold">Facility name<input name="facility" class="field mt-1"></label><label class="text-xs font-semibold">Auditor<input name="auditor" class="field mt-1"></label><label class="text-xs font-semibold">Audit date<input name="audit_date" type="date" class="field mt-1"></label><label class="text-xs font-semibold">Building type<select name="facility_type" class="field mt-1"><option value="">— Select —</option><option>Residential Single-Family</option><option>Residential Multi-Unit</option><option>Commercial</option><option>Industrial</option><option>Institutional</option><option>Mixed-Use</option></select></label><label class="text-xs font-semibold md:col-span-2">Street address<input name="address" class="field mt-1"></label><label class="text-xs font-semibold">City<input name="city" class="field mt-1"></label><label class="text-xs font-semibold">Province / State<input name="province" class="field mt-1"></label><label class="text-xs font-semibold">Gross floor area<input name="floor_area" type="number" step="0.01" class="field mt-1"></label><label class="text-xs font-semibold">Area unit<select name="area_unit" class="field mt-1"><option>m²</option><option>ft²</option></select></label><label class="text-xs font-semibold md:col-span-2">Notes<textarea name="notes" class="field mt-1" rows="3"></textarea></label></div><div class="flex justify-end gap-2 mt-5"><button type="button" id="cancelProject" class="btn bg-slate-200">Cancel</button><button type="submit" class="btn blue">Save project</button></div></form></dialog><input id="file" type="file" accept="application/json" hidden>
<script>
const localKey='audit-dashboard-v3';let projects=loadLocalProjects(),editing=null,microsoftReady=false,microsoftMsalInstance=null;const $=id=>document.getElementById(id);
function loadLocalProjects(){try{return JSON.parse(localStorage.getItem(localKey)||'[]')}catch(error){console.error('Could not load local projects:',error);return[]}}
function saveLocalProjects(){localStorage.setItem(localKey,JSON.stringify(projects))}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[character]))}
function safeId(id){return encodeURIComponent(String(id??''))}
const isLocal=location.hostname==='localhost'||location.hostname==='127.0.0.1';const microsoftMsalConfig={auth:{clientId:'f21c7beb-f07a-4f63-a384-84272182483e',authority:'https://login.microsoftonline.com/organizations',redirectUri:isLocal?'http://localhost:3000/':'https://ebakojoseph.github.io/audit_toolkit/'},cache:{cacheLocation:'sessionStorage',storeAuthStateInCookie:false}};const microsoftLoginRequest={scopes:['User.Read']};
async function initializeMicrosoftAuthentication(){if(!window.msal){console.error('MSAL.js did not load');$('btn-ms-login').disabled=true;$('btn-ms-login').textContent='Microsoft unavailable';return}try{microsoftMsalInstance=new window.msal.PublicClientApplication(microsoftMsalConfig);await microsoftMsalInstance.initialize();const result=await microsoftMsalInstance.handleRedirectPromise();const account=result?.account||microsoftMsalInstance.getAllAccounts()[0]||null;microsoftReady=true;if(account){microsoftMsalInstance.setActiveAccount(account);displayMicrosoftAccount(account)}}catch(error){microsoftReady=false;console.error('Microsoft authentication initialization failed:',error)}}
async function signInWithMicrosoft(){if(!microsoftMsalInstance||!microsoftReady){alert('Microsoft sign-in is still initializing. Please try again.');return}try{await microsoftMsalInstance.loginRedirect(microsoftLoginRequest)}catch(error){console.error('Microsoft sign-in failed:',error);alert(`Microsoft sign-in failed: ${error.message}`)}}
function displayMicrosoftAccount(account){$('btn-ms-login').textContent='Microsoft connected';$('btn-ms-login').disabled=true;$('btn-ms-login').classList.add('opacity-70','cursor-not-allowed');$('ms-user-name').textContent=account.name||account.username||''}
function searchText(project){return [project.project_id,project.client,project.facility,project.auditor,project.address,project.city,project.province,project.facility_type,project.floor_area,project.area_unit,project.notes].filter(Boolean).join(' ').toLowerCase()}
function badge(status){status=status||'Not started';const className=status==='Complete'?'done':status==='In progress'?'in':'';return `<span class="status ${className}">${escapeHtml(status)}</span>`}
function updateFilters(){const selectedClient=$('clientFilter').value,selectedAuditor=$('auditorFilter').value;const clients=[...new Set(projects.map(p=>p.client).filter(Boolean))].sort(),auditors=[...new Set(projects.map(p=>p.auditor).filter(Boolean))].sort();$('clientFilter').innerHTML='<option value="">All clients</option>'+clients.map(v=>`<option value="${escapeHtml(v)}" ${v===selectedClient?'selected':''}>${escapeHtml(v)}</option>`).join('');$('auditorFilter').innerHTML='<option value="">All auditors</option>'+auditors.map(v=>`<option value="${escapeHtml(v)}" ${v===selectedAuditor?'selected':''}>${escapeHtml(v)}</option>`).join('')}
function filteredProjects(){const q=$('search').value.trim().toLowerCase(),client=$('clientFilter').value,auditor=$('auditorFilter').value,status=$('statusFilter').value;return projects.filter(p=>(!q||searchText(p).includes(q))&&(!client||p.client===client)&&(!auditor||p.auditor===auditor)&&(!status||p.status===status))}
function renderRow(p){const id=safeId(p.id);return `<tr class="border-t border-slate-200"><td class="p-3 font-semibold">${escapeHtml(p.project_id)}</td><td class="p-3">${escapeHtml(p.client)}</td><td class="p-3">${escapeHtml(p.facility)}</td><td class="p-3">${escapeHtml(p.auditor)}</td><td class="p-3">${escapeHtml(p.audit_date)}</td><td class="p-3 text-center">${badge(p.envelope_status)}</td><td class="p-3 text-center">${badge(p.equipment_status)}</td><td class="p-3 text-center">${badge(p.status)}</td><td class="p-3">${p.updated_at?new Date(p.updated_at).toLocaleDateString():''}</td><td class="p-3 whitespace-nowrap"><button type="button" class="text-[#1e6fbd] font-bold mr-2" onclick="openAudit('${id}','envelope')">Envelope</button><button type="button" class="text-[#1e6fbd] font-bold" onclick="openAudit('${id}','equipment')">Equipment</button><button type="button" class="text-slate-500 font-bold ml-2" onclick="editProject('${id}')">Edit</button></td></tr>`}
function renderProjects(){updateFilters();const list=filteredProjects();$('empty').classList.toggle('hidden',list.length>0);$('projects').innerHTML=list.map(renderRow).join('')}
function openAudit(encoded,type){const id=decodeURIComponent(encoded),page=type==='equipment'?'EquipmentAudit.html':'BuildingEnvelopeChecklist.html';location.href=`${page}?project=${encodeURIComponent(id)}`}
function clearForm(){$('projectForm').reset();$('projectForm').elements.area_unit.value='m²'}
function fillForm(p){const f=$('projectForm').elements;for(const k of ['project_id','client','facility','auditor','audit_date','address','city','province','facility_type','floor_area','notes'])f[k].value=p[k]||'';f.area_unit.value=p.area_unit||'m²'}
function openNew(){editing=null;clearForm();$('projectDialog').showModal()}
function editProject(encoded){const p=projects.find(item=>item.id===decodeURIComponent(encoded));if(!p)return;editing=p;fillForm(p);$('projectDialog').showModal()}
function closeDialog(){if($('projectDialog').open)$('projectDialog').close()}
function newProject(f){const now=new Date().toISOString();return{id:crypto.randomUUID(),project_id:f.project_id||'',client:f.client||'',facility:f.facility||'',auditor:f.auditor||'',audit_date:f.audit_date||'',address:f.address||'',city:f.city||'',province:f.province||'',facility_type:f.facility_type||'',floor_area:f.floor_area||'',area_unit:f.area_unit||'m²',notes:f.notes||'',status:'Not started',envelope_status:'Not started',equipment_status:'Not started',envelope_data:{},equipment_data:{},created_at:now,updated_at:now}}
function saveProject(p){p.updated_at=new Date().toISOString();const index=projects.findIndex(item=>item.id===p.id);if(index<0)projects.unshift(p);else projects[index]=p;saveLocalProjects();renderProjects()}
function submitProject(event){event.preventDefault();const form=Object.fromEntries(new FormData(event.target).entries());saveProject(editing?{...editing,...form}:newProject(form));editing=null;closeDialog()}
function exportProjects(){const blob=new Blob([JSON.stringify(projects,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='audit-projects.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importProjects(){$('file').click()}function handleImport(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const imported=JSON.parse(reader.result);if(!Array.isArray(imported))throw Error('Imported file must contain an array');projects=imported;saveLocalProjects();renderProjects()}catch(error){alert(`Import failed: ${error.message}`)}event.target.value=''};reader.readAsText(file)}
function bindEvents(){$('new').addEventListener('click',openNew);$('cancelProject').addEventListener('click',closeDialog);$('projectForm').addEventListener('submit',submitProject);$('search').addEventListener('input',renderProjects);['clientFilter','auditorFilter','statusFilter'].forEach(id=>$(id).addEventListener('change',renderProjects));$('export').addEventListener('click',exportProjects);$('import').addEventListener('click',importProjects);$('file').addEventListener('change',handleImport);$('btn-ms-login').addEventListener('click',signInWithMicrosoft)}
async function init(){bindEvents();await initializeMicrosoftAuthentication();renderProjects();if(window.lucide?.createIcons)window.lucide.createIcons()}init();
</script>
</body>
</html>
