<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipment Audit</title><style>body{font-family:system-ui;margin:2rem;max-width:1100px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ccc;padding:.5rem}input,select,textarea{width:100%;box-sizing:border-box}</style></head><body><h1>Residential Equipment Audit</h1><p>Record equipment measurements, annual energy, ratings, recommendations, and M&amp;V data.</p><button onclick="download()">Save project JSON</button><table><thead><tr><th>Category</th><th>Equipment</th><th>Voltage</th><th>Current</th><th>PF</th><th>Hours/year</th><th>Estimated kWh/year</th><th>Status / recommendation</th></tr></thead><tbody id="rows"></tbody></table><script>const items=['Furnace','Boiler','Heat pump','Air conditioner','Lighting','Water heater','Refrigerator','Freezer','Dishwasher','Clothes washer','Clothes dryer','Plug loads','EV charger'];function row(i){return `<tr><td><input value="${items[i]}"></td><td><input></td><td><input type="number" value="120"></td><td><input class="a" type="number"></td><td><input class="pf" type="number" step=".01" value="1"></td><td><input class="h" type="number"></td><td><output class="k"></output></td><td><textarea></textarea></td></tr>`}document.getElementById('rows').innerHTML=items.map((_,i)=>row(i)).join('');document.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));function calc(){document.querySelectorAll('tr').forEach(r=>{let v=+r.querySelector('input[type=number]')?.value||0;let nums=[...r.querySelectorAll('input[type=number]')].map(x=>+x.value||0);let a=nums[1]||0,pf=nums[2]||1,h=nums[3]||0;let o=r.querySelector('.k');if(o)o.value=(v*a*pf*h/1000).toFixed(1)})}function download(){let b=new Blob([document.documentElement.outerHTML],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='EquipmentAudit.html';a.click()}</script></body></html>
