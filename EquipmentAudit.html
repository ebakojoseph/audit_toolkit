  <!-- Top Navigation Header with Fixed Sizing & Spacing -->

        <div class="flex-1 bg-[#1a3460] rounded-full h-2.5 overflow-hidden">
          <div id="progress-fill" class="h-full bg-[#4797e7] rounded-full" style="width: 0%"></div>

  <!-- Functional Execution Logic Scripts -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      // 1. Initialize Visual SVGs via Lucide Engine
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }

      // 2. Clear Active Fields Logic Handler
      document.getElementById('btn-reset')?.addEventListener('click', () => {
        if (confirm('Are you completely sure you want to clear all form entries?')) {
          const targetForm = document.getElementById('auditForm');
          if (targetForm) {
            targetForm.reset();
            
            // Explicit check to guarantee clean textareas and filters are dropped back to empty
            targetForm.querySelectorAll('input, textarea, select').forEach(element => {
              if (!element.disabled && !element.readOnly) {
                element.value = '';
              }
            });

            // Trigger structural updates to your progress metrics manually
            const fill = document.getElementById('progress-fill');
            const pct = document.getElementById('progress-pct');
            if (fill) fill.style.width = '0%';
            if (pct) pct.innerText = '0%';
          }
        }
      });

      // 3. Print Handler Shortcut Binding
      document.getElementById('btn-print')?.addEventListener('click', () => {
        window.print();
      });
    });
  </script>
